<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="caixa-conversora">
        <h1>Conversor de Moedas</h1>
        
        <div class="campo">
            <label for="valor-real">Valor em R$ (Real):</label>
            <input type="number" id="valor-real" placeholder="Ex: 100.00">
        </div>

        <div class="campo">
            <label for="moeda-destino">Converter para:</label>
            <select id="moeda-destino">
                <option value="USD">Dólar Americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra Esterlina (GBP)</option>
                <option value="JPY">Iene Japonês (JPY)</option>
                <option value="ARS">Peso Argentino (ARS)</option>
                <option value="CAD">Dólar Canadense (CAD)</option>
                <option value="AUD">Dólar Australiano (AUD)</option>
                <option value="CHF">Franco Suíço (CHF)</option>
                <option value="CNY">Yuan Chinês (CNY)</option>
            </select>
        </div>

        <button id="btn-converter">Converter Agora</button>
        
        <div id="resultado-container">
            <p id="valor-convertido">R$ 0,00</p>
        </div>
    </div>        
    <script src="script.js"></script>
    
</body>
</html>
